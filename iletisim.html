<div id="app" class="container mt-4">

    <h1>İletişim Formu</h1>

    <form>

        <input type="text" id="ad" class="form-control mb-2" placeholder="Ad">

        <input type="email" id="email" class="form-control mb-2" placeholder="Email">

        <input type="text" id="telefon" class="form-control mb-2" placeholder="Telefon">

        <label>Cinsiyet:</label><br>
        <input type="radio" name="cinsiyet" value="erkek"> Erkek
        <input type="radio" name="cinsiyet" value="kadin"> Kadın
        <br><br>

        <label>İlgi Alanları:</label><br>
        <input type="checkbox"> Spor
        <input type="checkbox"> Müzik
        <input type="checkbox"> Yazılım
        <br><br>

        <select class="form-control mb-2">
            <option>İstanbul</option>
            <option>Ankara</option>
            <option>İzmir</option>
        </select>

        <textarea class="form-control mb-2" placeholder="Mesaj"></textarea>

        <!-- NORMAL JS -->
        <button type="button" class="btn btn-danger" onclick="kontrolEt()">JS Kontrol</button>

        <!-- VUE -->
        <button type="button" class="btn btn-success" @click="vueKontrol">Vue Kontrol</button>

    </form>

</div>

<script src="js/script.js"></script>

<script>
new Vue({
    el: "#app",
    methods: {
        vueKontrol() {
          let ad = document.getElementById("ad").value;
            let email = document.getElementById("email").value;
            let telefon = document.getElementById("telefon").value;

            if (ad == "" || email == "" || telefon == "") {
                alert("Boş alanları doldurun!");
                return;
            }

            if (!email.includes("@")) {
                alert("Email hatalı!");
                return;
            }

            if (isNaN(telefon)) {
                alert("Telefon sadece sayı olmalı!");
                return;
            }

            alert("Vue kontrol başarılı!");
        }
    }
});
</script>

</body>
